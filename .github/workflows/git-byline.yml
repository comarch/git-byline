name: git-byline forge attribution

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: git-byline-notes-${{ github.repository }}-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_BYLINE_CI_SOURCE: ${{ github.event.pull_request.head.sha }}
      GIT_BYLINE_CI_TARGET: ${{ github.event.pull_request.merge_commit_sha }}
      GIT_BYLINE_REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Prepare isolated runner paths
        run: |
          set -euo pipefail
          {
            printf 'EMPTY_HOOKS=%s\n' "$RUNNER_TEMP/git-byline-empty-hooks"
            printf 'HOME=%s\n' "$RUNNER_TEMP/git-byline-home"
            printf 'XDG_CONFIG_HOME=%s\n' "$RUNNER_TEMP/git-byline-home/config"
          } >> "$GITHUB_ENV"

      - name: Fetch pull request commits and notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # GitHub git endpoints accept HTTP basic auth only; bearer is
          # rejected with 401, so the token rides the header as
          # x-access-token, exactly how actions/checkout authenticates.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git_byline() {
            GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            GIT_CONFIG_KEY_1=credential.helper \
            GIT_CONFIG_VALUE_1="" \
            git -c remote.origin.url="$GIT_BYLINE_REMOTE_URL" "$@"
          }
          mkdir -p "$EMPTY_HOOKS"
          git remote set-url origin "$GIT_BYLINE_REMOTE_URL"
          git config --local core.hooksPath "$EMPTY_HOOKS"
          git_byline fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/git-byline-pr-head"
          if source="$(git rev-parse "${GIT_BYLINE_CI_TARGET}^2" 2>/dev/null)"; then
            base="$(git rev-parse "${GIT_BYLINE_CI_TARGET}^1")"
          else
            source="$GIT_BYLINE_CI_SOURCE"
            base="$(git merge-base "$source" "${GIT_BYLINE_CI_TARGET}")"
          fi
          test -n "$base"
          printf 'GIT_BYLINE_CI_BASE=%s\n' "$base" >> "$GITHUB_ENV"
          printf 'GIT_BYLINE_CI_SOURCE=%s\n' "$source" >> "$GITHUB_ENV"
          notes="$(git_byline ls-remote --refs origin refs/notes/byline)"
          if [ -n "$notes" ]; then
            git_byline fetch --no-tags origin refs/notes/byline:refs/notes/byline
          fi

      - name: Configure local Git identity
        run: |
          set -euo pipefail
          mkdir -p "$EMPTY_HOOKS"
          git remote set-url origin "$GIT_BYLINE_REMOTE_URL"
          git config --local core.hooksPath "$EMPTY_HOOKS"
          git config --local user.name git-byline-ci
          git config --local user.email git-byline-ci@users.noreply.github.com

      - name: Reconstruct attribution
        env:
          CGO_ENABLED: "0"
          GOPROXY: "off"
        run: go run ./cmd/git-byline ci run --provider github

      - name: Harden Git before push
        run: |
          set -euo pipefail
          push_hooks="$(mktemp -d "${RUNNER_TEMP}/git-byline-push-hooks.XXXXXX")"
          printf 'GIT_BYLINE_PUSH_HOOKS=%s\n' "$push_hooks" >> "$GITHUB_ENV"
          mkdir -p "$push_hooks"
          git remote set-url origin "$GIT_BYLINE_REMOTE_URL"
          git config --local core.hooksPath "$push_hooks"
          git config --local user.name git-byline-ci
          git config --local user.email git-byline-ci@users.noreply.github.com

      - name: Push attribution notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub git endpoints accept HTTP basic auth only; bearer is
          # rejected with 401, so the token rides the header as
          # x-access-token, exactly how actions/checkout authenticates.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git_byline() {
            GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            GIT_CONFIG_KEY_1=credential.helper \
            GIT_CONFIG_VALUE_1="" \
            git -c remote.origin.url="$GIT_BYLINE_REMOTE_URL" "$@"
          }
          mkdir -p "$GIT_BYLINE_PUSH_HOOKS"
          git remote set-url origin "$GIT_BYLINE_REMOTE_URL"
          git config --local core.hooksPath "$GIT_BYLINE_PUSH_HOOKS"
          if git show-ref --verify --quiet refs/notes/byline; then
            git_byline push --no-verify origin refs/notes/byline:refs/notes/byline
          fi
