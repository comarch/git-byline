name: PromptScript

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptscript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PromptScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate PromptScript
        run: npm exec --yes --package @promptscript/cli@1.21.0 -- prs validate --strict

      - name: Compile PromptScript
        run: |
          npm exec --yes --package @promptscript/cli@1.21.0 -- prs compile --all-builds --force --strict
          npm exec --yes --package @promptscript/cli@1.21.0 -- prs compile --all --force --strict

      # The committed OpenCode plugin carries the git-byline patch on top of
      # the generated output, so patch the fresh output before comparing.
      - name: Patch OpenCode plugin
        run: go run ./tools/validate -patch-opencode
        env:
          CGO_ENABLED: "0"
          GOPROXY: "off"

      - name: Check generated files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
