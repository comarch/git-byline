name: Dependabot automerge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    name: Enable auto-merge for Dependabot
    # dependabot.yml has no supported automerge key, so this enables GitHub
    # native auto-merge on each Dependabot pull request. Required checks stay
    # the merge gate and the squash method matches the repository default.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge on the pull request
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
