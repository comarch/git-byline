# Dependabot owns the documentation website's npm dependencies; renovate.json
# covers Go modules, GitHub Actions, and the PromptScript pins. Each tool
# manages a disjoint set, so no dependency update opens two pull requests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
      scope: website
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
