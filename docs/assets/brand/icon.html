<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>git-byline icon</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				background: #000000;
			}
			.icon {
				box-sizing: border-box;
				width: 512px;
				height: 512px;
				background: #000000;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 34px;
			}
			/* The gutter reads as the blame column the lines are labelled from. */
			.gutter {
				width: 20px;
				height: 274px;
				border-radius: 10px;
				background: linear-gradient(
					180deg,
					#00ffff 0%,
					#6400be 50%,
					#ff0000 100%
				);
			}
			.lines {
				display: flex;
				flex-direction: column;
				gap: 30px;
			}
			.lines span {
				height: 46px;
				border-radius: 23px;
			}
			.ai {
				width: 250px;
				background: #00ffff;
			}
			.human {
				width: 178px;
				background: #b280df;
			}
			.override {
				width: 214px;
				background: #ff009b;
			}
			.untracked {
				width: 136px;
				background: #a6a6a6;
			}
		</style>
	</head>
	<body>
		<div class="icon">
			<div class="gutter"></div>
			<div class="lines">
				<span class="ai"></span>
				<span class="human"></span>
				<span class="override"></span>
				<span class="untracked"></span>
			</div>
		</div>
	</body>
</html>
